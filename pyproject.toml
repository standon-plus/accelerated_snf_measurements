[project]
name = "snf"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "spherical"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["snf"]
